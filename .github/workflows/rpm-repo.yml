name: Build and Publish Selfnet Boringtun RPM Repo

on:
  workflow_dispatch:

# Required permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: almalinux:10

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          dnf update -y
          dnf install -y gcc rpm-build createrepo_c tar

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Rust Project
        run: |
          source "$HOME/.cargo/env"
          cargo build -p boringtun-cli --release

      - name: Generate RPM
        run: |
          source "$HOME/.cargo/env"
          cargo install cargo-generate-rpm

          # This is a downstream fork of boringtun, and we want to version by
          # build timestamp (e.g., 20260505105330) instead of adjusting
          # boringtun's versions.
          BUILD_TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # Overwrite the name and release fields without altering Cargo.toml
          cargo generate-rpm \
            -p boringtun-cli \
            -s "name = \"selfnet-boringtun\"" \
            -s "release = \"${BUILD_TIMESTAMP}\""

      - name: Generate DNF Repository
        run: |
          mkdir -p _site/x86_64

          # Move the generated RPM into the static site directory
          cp target/generate-rpm/*.rpm _site/x86_64/

          # Generate repository metadata
          createrepo_c _site/x86_64/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
